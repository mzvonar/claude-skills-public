name: validate
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code
      # ONE step, the same script a maintainer runs before pushing: the steps used to be listed here
      # and a subset of them in the docs, and the ones only CI ran (describe-changes' version parity)
      # were red on eleven pushes that had each been reported as done. The log names every failing
      # section; the list of what runs, and why each exists, lives in scripts/check-all.sh.
      - name: check-all (validate + every test suite)
        run: bash scripts/check-all.sh

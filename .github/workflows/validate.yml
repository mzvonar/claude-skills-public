name: validate
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate marketplace and plugins
        run: scripts/validate.sh
      - name: describe-changes tests
        run: bash plugins/describe-changes/tests/run.sh
      - name: workflow tests
        run: bash plugins/workflow/tests/run.sh
      # Asserts the WIRING, not only the logic: every SKILL.md calling plugin-freshness.sh must
      # name a path that resolves from its own plugin root and must pass it an argument. The first
      # rollout of that check was wired to a command that could never work, and nothing went red.
      - name: plugin-freshness tests
        run: bash scripts/tests/plugin-freshness.test.sh
      # check-drift.sh and validate.sh are maintainer scripts and had no test of any kind: the
      # worktree fix in the first was one reverted line away from silently coming back, and the
      # external version pairing in the second had never been observed to fire. Synthetic repos and
      # a synthetic CLAUDE_CONFIG_DIR, so nothing here reads the runner's own installed plugins.
      - name: maintainer-script tests
        run: bash scripts/tests/maintainer-scripts.test.sh

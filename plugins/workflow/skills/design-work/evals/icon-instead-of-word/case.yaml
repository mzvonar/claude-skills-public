schema_version: "1.1"
name: icon-instead-of-word
expected_outcome: |
  Each comment's red "Delete" button becomes a small × matching the toast's close button (same glyph, font, size
  and muted colour, a hover that brightens), placed unobtrusively at the comment's top right, with an accessible
  name, and still easy to tap on a phone without making the comment taller. The work ends with screenshots at a
  desktop and a phone width that the model looked at.
